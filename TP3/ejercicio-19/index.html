<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 19</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Registro en 2 pasos</h1>
    </header>

    <main>
        <form class="form-pasos" action="#" method="post">

            <!-- Radios ocultos que controlan qué paso se muestra -->
            <input type="radio" name="paso" id="radio-paso1" class="radio-paso" checked>
            <input type="radio" name="paso" id="radio-paso2" class="radio-paso">

            <div class="indicador">
                <span class="punto punto1">1</span>
                <span class="linea"></span>
                <span class="punto punto2">2</span>
            </div>

            <!-- Paso 1 -->
            <section class="paso paso1">
                <h2>Paso 1: Datos personales</h2>

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required minlength="2">
                </div>

                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <label for="radio-paso2" class="boton siguiente">Siguiente →</label>
            </section>

            <!-- Paso 2 -->
            <section class="paso paso2">
                <h2>Paso 2: Cuenta</h2>

                <div class="campo">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required minlength="4">
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <div class="botones">
                    <label for="radio-paso1" class="boton atras">← Atrás</label>
                    <button type="submit" class="boton enviar">Registrarme</button>
                </div>
            </section>
        </form>
    </main>

</body>

</html>
